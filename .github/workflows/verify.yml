name: SettleKit verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: make docs-verify
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.4
          cache: false
      - name: Install pinned Slither entrypoint
        run: |
          python3 -m venv .venv-slither
          .venv-slither/bin/python -m pip install slither-analyzer==0.11.6
      - name: Contract checks
        run: |
          export PATH="$PWD/.venv-slither/bin:$PATH"
          make contract-verify
  go-and-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: settlekit
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: settlekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlekit -d settlekit"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      SETTLEKIT_TEST_DATABASE_URL: postgres://settlekit:local_ci_only@localhost:5432/settlekit?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.1'
          cache: true
      - run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go test ./internal/payments -run '^$' -fuzz '^FuzzTerminalCannotCrossToOtherTerminal$' -fuzztime=3s -parallel=2
  full-verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: settlekit
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: settlekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlekit -d settlekit"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      SETTLEKIT_TEST_DATABASE_URL: postgres://settlekit:local_ci_only@localhost:5432/settlekit?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.1'
          cache: true
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.4
          cache: false
      - name: Install pinned security tools
        run: |
          python3 -m venv .venv-slither
          .venv-slither/bin/python -m pip install slither-analyzer==0.11.6
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/aquasecurity/trivy/cmd/trivy@v0.75.0
          go install github.com/anchore/syft/cmd/syft@v1.54.0
          echo "$PWD/.venv-slither/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Complete local gate for this commit
        run: make local-verify
